# Generate the Xcode project:  brew install xcodegen && cd ios && xcodegen
name: G1Translator
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set your team in Xcode → Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
targets:
  G1Translator:
    type: application
    platform: iOS
    sources:
      - path: G1Translator
        excludes: ["lc3/NOTICE.md"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.g1translator
        SWIFT_OBJC_BRIDGING_HEADER: G1Translator/G1Translator-Bridging-Header.h
        GCC_OPTIMIZATION_LEVEL: s
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: G1Translator/Info.plist
      properties:
        CFBundleDisplayName: G1 Translator
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Listens to the conversation so it can be translated.
        NSSpeechRecognitionUsageDescription: Turns speech into text on your iPhone for translation.
        NSBluetoothAlwaysUsageDescription: Connects to your Even Realities G1 glasses to show translations.
        UIBackgroundModes: [audio, bluetooth-central]
