<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<rect width="1080" height="330" rx="16" fill="#0b0f0d"/>
<text x="30" y="44" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">1 · KDYŽ MLUVÍ</text>
<rect x="30" y="60" width="320" height="170" rx="10" fill="#050806" stroke="#2a9d63" stroke-width="1.5"/>
<text x="46" y="94" fill="#2a9d63" font-size="15" font-weight="700">[ŠPANĚLŠTINA]</text>
<text x="46" y="122" fill="#3cff8f" font-size="15">Ahoj, odkud jsi?</text>
<text x="46" y="150" fill="#3cff8f" font-size="15">Líbí se ti Paraguay?</text>
<text x="30" y="258" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Živý překlad, u první věty</text>
<text x="30" y="278" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">název jazyka.</text>
<path d="M356 145 H372" stroke="#2a9d63" stroke-width="2.5"/><path d="M372 138 L382 145 L372 152 Z" fill="#2a9d63"/>
<text x="380" y="44" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">2 · KDYŽ DOMLUVÍ</text>
<rect x="380" y="60" width="320" height="170" rx="10" fill="#050806" stroke="#3cff8f" stroke-width="2"/>
<text x="396" y="94" font-size="15"><tspan fill="#3cff8f">+ Jsem Čech:</tspan><tspan dx="8" fill="#2a9d63">soj čeko</tspan></text>
<text x="396" y="122" font-size="15"><tspan fill="#3cff8f">- Moc ne:</tspan><tspan dx="8" fill="#2a9d63">no mučo</tspan></text>
<text x="396" y="150" font-size="15"><tspan fill="#3cff8f">? A ty?:</tspan><tspan dx="8" fill="#2a9d63">i tu</tspan></text>
<text x="380" y="258" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Všechny tři odpovědi najednou –</text>
<text x="380" y="278" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">význam, pak jak to říct.</text>
<path d="M706 145 H722" stroke="#2a9d63" stroke-width="2.5"/><path d="M722 138 L732 145 L722 152 Z" fill="#2a9d63"/>
<text x="730" y="44" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">3 · KDYŽ ODPOVÍŠ</text>
<rect x="730" y="60" width="320" height="170" rx="10" fill="#050806" stroke="#2a9d63" stroke-width="1.5"/>
<text x="746" y="94" fill="#2a9d63" font-size="15" font-weight="700">ZEPTEJ SE:</text>
<text x="746" y="122" font-size="15"><tspan fill="#3cff8f">? A ty?:</tspan><tspan dx="8" fill="#2a9d63">i tu</tspan></text>
<text x="746" y="150" font-size="15"><tspan fill="#3cff8f">? Bydlíš tady?:</tspan><tspan dx="8" fill="#2a9d63">bives aki</tspan></text>
<text x="746" y="178" font-size="15"><tspan fill="#3cff8f">? Líbí se ti?:</tspan><tspan dx="8" fill="#2a9d63">te gusta</tspan></text>
<text x="730" y="258" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Otázky, na co se zeptat zpátky,</text>
<text x="730" y="278" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">naskočí hned po tvé odpovědi.</text>
<text x="30" y="314" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Úplně bez rukou – nic se neťuká. TouchBar je jen volitelný.</text>
</svg>