<text x="40" y="312" fill="#8b949e" font-size="13" text-anchor="start" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">The phone does the thinking, the glasses show it. Only text is sent to the API. Replies are ready before the speaker finishes.</text>
