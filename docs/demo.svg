<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<rect width="1080" height="330" rx="16" fill="#0b0f0d"/>
<text x="30" y="44" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">1 · WHILE THEY SPEAK</text>
<rect x="30" y="60" width="320" height="170" rx="10" fill="#050806" stroke="#2a9d63" stroke-width="1.5"/>
<text x="46" y="94" fill="#2a9d63" font-size="15" font-weight="700">[SPANISH]</text>
<text x="46" y="122" fill="#3cff8f" font-size="15">Hi, where are you from?</text>
<text x="46" y="150" fill="#3cff8f" font-size="15">Do you like Paraguay?</text>
<text x="30" y="258" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Live translation, language</text>
<text x="30" y="278" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">shown on the first sentence.</text>
<path d="M356 145 H372" stroke="#2a9d63" stroke-width="2.5"/><path d="M372 138 L382 145 L372 152 Z" fill="#2a9d63"/>
<text x="380" y="44" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">2 · WHEN THEY FINISH</text>
<rect x="380" y="60" width="320" height="170" rx="10" fill="#050806" stroke="#3cff8f" stroke-width="2"/>
<text x="396" y="94" font-size="15"><tspan fill="#3cff8f">+ I'm Czech:</tspan><tspan dx="8" fill="#2a9d63">soy CHEH-koh</tspan></text>
<text x="396" y="122" font-size="15"><tspan fill="#3cff8f">- Not really:</tspan><tspan dx="8" fill="#2a9d63">noh MOO-choh</tspan></text>
<text x="396" y="150" font-size="15"><tspan fill="#3cff8f">? And you?:</tspan><tspan dx="8" fill="#2a9d63">ee too</tspan></text>
<text x="380" y="258" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">All three replies at once –</text>
<text x="380" y="278" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">meaning, then how to say it.</text>
<path d="M706 145 H722" stroke="#2a9d63" stroke-width="2.5"/><path d="M722 138 L732 145 L722 152 Z" fill="#2a9d63"/>
<text x="730" y="44" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">3 · AFTER YOU ANSWER</text>
<rect x="730" y="60" width="320" height="170" rx="10" fill="#050806" stroke="#2a9d63" stroke-width="1.5"/>
<text x="746" y="94" fill="#2a9d63" font-size="15" font-weight="700">ASK:</text>
<text x="746" y="122" font-size="15"><tspan fill="#3cff8f">? And you?:</tspan><tspan dx="8" fill="#2a9d63">ee too</tspan></text>
<text x="746" y="150" font-size="15"><tspan fill="#3cff8f">? Live here?:</tspan><tspan dx="8" fill="#2a9d63">BEE-vess ah-KEE</tspan></text>
<text x="746" y="178" font-size="15"><tspan fill="#3cff8f">? Like it?:</tspan><tspan dx="8" fill="#2a9d63">teh GOOS-tah</tspan></text>
<text x="730" y="258" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Questions to ask back appear</text>
<text x="730" y="278" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">as soon as you've answered.</text>
<text x="30" y="314" fill="#8b949e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Completely hands-free – no tapping needed. The TouchBar is optional.</text>
</svg>