<svg xmlns="http://www.w3.org/2000/svg" width="980" height="322" viewBox="0 0 980 322" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<rect width="980" height="322" rx="16" fill="#0b0f0d"/>
<text x="40" y="44" fill="#8b949e" font-size="14" text-anchor="start" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">TOUCHBAR</text>
<text x="40" y="66" fill="#8b949e" font-size="13" text-anchor="start" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Everything works hands-free. Gestures are optional.</text>
<text x="210" y="98" fill="#2a9d63" font-size="12" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">LEFT TEMPLE</text>
<text x="450" y="98" fill="#2a9d63" font-size="12" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">RIGHT TEMPLE</text>
<rect x="40" y="112" width="900" height="52" rx="10" fill="#050806" stroke="#2a9d63" stroke-width="1.5"/>
<rect x="120" y="124" width="180" height="28" rx="14" fill="none" stroke="#3cff8f" stroke-width="1.5"/>
<text x="210" y="143" fill="#3cff8f" font-size="14" text-anchor="middle">hold</text>
<text x="580" y="144" fill="#3cff8f" font-size="15">say it in your language → see it translated</text>
<rect x="40" y="176" width="900" height="52" rx="10" fill="#050806" stroke="#2a9d63" stroke-width="1.5"/>
<rect x="120" y="188" width="180" height="28" rx="14" fill="none" stroke="#3cff8f" stroke-width="1.5"/>
<text x="210" y="207" fill="#3cff8f" font-size="14" text-anchor="middle">double tap</text>
<rect x="360" y="188" width="180" height="28" rx="14" fill="none" stroke="#3cff8f" stroke-width="1.5"/>
<text x="450" y="207" fill="#3cff8f" font-size="14" text-anchor="middle">double tap</text>
<text x="580" y="208" fill="#3cff8f" font-size="15">hide suggestions · again: new conversation</text>
<rect x="40" y="240" width="900" height="52" rx="10" fill="#050806" stroke="#2a9d63" stroke-width="1.5"/>
<rect x="120" y="252" width="180" height="28" rx="14" fill="none" stroke="#3cff8f" stroke-width="1.5"/>
<text x="210" y="271" fill="#3cff8f" font-size="14" text-anchor="middle">triple tap</text>
<rect x="360" y="252" width="180" height="28" rx="14" fill="none" stroke="#3cff8f" stroke-width="1.5"/>
